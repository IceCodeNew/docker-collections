name: Stronghold-Protocol Image CI
permissions: {}

on:
  push:
    branches:
    - 'master'
    - 'renovate/**'
    paths:
    - '.github/workflows/Stronghold-Protocol.yml'
    - 'Stronghold-Protocol/**'
  pull_request:
    paths:
    - '.github/workflows/Stronghold-Protocol.yml'
    - 'Stronghold-Protocol/**'
  workflow_dispatch:

env:
  # renovate: datasource=github-releases depName=Stronghold-Protocol packageName=sganggs/Stronghold-Protocol
  STRONGHOLD_PROTOCOL_VERSION: v0.1.4
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/stronghold-protocol

jobs:
  stronghold-protocol:
    # DHI credentials are unavailable to forks; Renovate branches use push validation.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.head_ref, 'renovate/'))
    name: stronghold-protocol
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: upstream
          persist-credentials: false
          repository: sganggs/Stronghold-Protocol
          ref: ${{ env.STRONGHOLD_PROTOCOL_VERSION }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DHI
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./collection/Stronghold-Protocol
          build-contexts: src_dir=./upstream
          target: tested
          build-args: |
            "TEST_RUNTIME_ARGS=[""run"",""--allow-read"",""--allow-net"",""--allow-env"",""--allow-run""]"
          platforms: ${{ matrix.platform }}
          load: true
          tags: stronghold-protocol:test
          cache-from: type=gha,scope=stronghold-protocol-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=stronghold-protocol-${{ matrix.platform }}
      - name: Test image without a public tunnel
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/cloudflared stronghold-protocol:test --version
          mapfile -d '' -t server_command < <(docker image inspect stronghold-protocol:test \
            | jq -j '.[0].Config.Cmd[] + "\u0000"')
          docker run --detach --name stronghold-protocol-smoke \
            --entrypoint /usr/bin/catatonit stronghold-protocol:test \
            -- "${server_command[@]}"
          trap 'docker logs stronghold-protocol-smoke; docker rm -f stronghold-protocol-smoke' EXIT
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' stronghold-protocol-smoke)
            printf 'Health check %s: %s\n' "$attempt" "$status"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Build and push by digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./collection/Stronghold-Protocol
          build-contexts: src_dir=./upstream
          build-args: FETCH_ASSETS=1
          push: true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=stronghold-protocol-${{ matrix.platform }}
          outputs: type=image,compression=estargz,force-compression=true,oci-mediatypes=true,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          digest: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/stronghold-protocol-digests/
          touch "/tmp/stronghold-protocol-digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stronghold-protocol-digests-${{ strategy.job-index }}
          path: /tmp/stronghold-protocol-digests/*
          if-no-files-found: error
          retention-days: 1

  stronghold-protocol-multiarch:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    needs: stronghold-protocol
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/stronghold-protocol-digests/
          pattern: stronghold-protocol-digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/stronghold-protocol-digests/
        env:
          version: ${{ env.STRONGHOLD_PROTOCOL_VERSION }}
        run: |
          images=()
          for digest in *; do
            images+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${REGISTRY_IMAGE}:latest" \
            --tag "${REGISTRY_IMAGE}:${version}" "${images[@]}"
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ env.STRONGHOLD_PROTOCOL_VERSION }}
          format: table
