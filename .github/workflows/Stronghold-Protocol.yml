name: Stronghold-Protocol Image CI
run-name: ${{ inputs.source_sha != '' && format('dev {0}', inputs.source_sha) || github.workflow }}
permissions: {}

on:
  push:
    branches:
    - 'master'
    - 'renovate/**'
    paths:
    - '.github/workflows/Stronghold-Protocol.yml'
    - 'Stronghold-Protocol/**'
  pull_request:
    paths:
    - '.github/workflows/Stronghold-Protocol.yml'
    - 'Stronghold-Protocol/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Fork review-all-in-one commit to publish as dev (empty for the upstream release)
        required: false
        type: string

env:
  # renovate: datasource=github-releases depName=Stronghold-Protocol packageName=sganggs/Stronghold-Protocol
  STRONGHOLD_PROTOCOL_VERSION: v0.2.1
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/stronghold-protocol

jobs:
  asset_bundle:
    # Image jobs need DHI credentials unavailable to forks; Renovate uses push validation.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-24.04
    outputs:
      fetched: ${{ steps.fetch_assets.outcome == 'success' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - name: Validate dev source SHA
        if: inputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: upstream
          persist-credentials: false
          repository: ${{ inputs.source_sha != '' && 'IceCodeNew/Stronghold-Protocol' || 'sganggs/Stronghold-Protocol' }}
          ref: ${{ inputs.source_sha || env.STRONGHOLD_PROTOCOL_VERSION }}
      - name: Resolve asset source revisions
        id: asset_sources
        shell: bash
        run: |
          set -euo pipefail
          python3 collection/Stronghold-Protocol/asset_cache.py revisions upstream/tools/assets/sources.mjs >> "$GITHUB_OUTPUT"
      - name: Resolve asset generator inputs
        id: asset_inputs
        run: |
          echo 'hash=${{ hashFiles('upstream/package-lock.json', 'upstream/tools/fetch-assets.mjs', 'upstream/tools/assets/**', 'upstream/shared/constants.js', 'upstream/data/assets.json', 'upstream/data/backups.json', 'upstream/data/bosses.json', 'upstream/data/chess.json', 'upstream/data/enemies.json', 'upstream/data/tokens.json', 'upstream/docs/research/03-operators.json', 'upstream/docs/research/05-enemies.json', 'upstream/docs/research/05-maps.json', 'upstream/docs/research/07-assets.json') }}' >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          check-latest: true
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Restore yuanyan assets
        id: yuanyan_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/yuanyan
          key: stronghold-assets-yuanyan-${{ steps.asset_sources.outputs.yuanyan }}-${{ steps.asset_inputs.outputs.hash }}
          restore-keys: stronghold-assets-yuanyan-${{ steps.asset_sources.outputs.yuanyan }}-
      - name: Restore fexli assets
        id: fexli_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/fexli
          key: stronghold-assets-fexli-${{ steps.asset_sources.outputs.fexli }}-${{ steps.asset_inputs.outputs.hash }}
          restore-keys: stronghold-assets-fexli-${{ steps.asset_sources.outputs.fexli }}-
      - name: Restore models assets
        id: models_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/models
          key: stronghold-assets-models-${{ steps.asset_sources.outputs.models }}-${{ steps.asset_inputs.outputs.hash }}
          restore-keys: stronghold-assets-models-${{ steps.asset_sources.outputs.models }}-
      - name: Restore arkassets assets
        id: arkassets_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/arkassets
          key: stronghold-assets-arkassets-${{ steps.asset_sources.outputs.arkassets }}-${{ steps.asset_inputs.outputs.hash }}
          restore-keys: stronghold-assets-arkassets-${{ steps.asset_sources.outputs.arkassets }}-
      - name: Restore fonts assets
        id: fonts_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/fonts
          key: stronghold-assets-fonts-${{ steps.asset_sources.outputs.fonts }}-${{ steps.asset_inputs.outputs.hash }}
          restore-keys: stronghold-assets-fonts-${{ steps.asset_sources.outputs.fonts }}-
      - name: Restore gamedata assets
        id: gamedata_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/gamedata
          key: stronghold-assets-gamedata-${{ steps.asset_sources.outputs.gamedata }}-${{ steps.asset_inputs.outputs.hash }}
          restore-keys: stronghold-assets-gamedata-${{ steps.asset_sources.outputs.gamedata }}-
      - name: Assemble cached assets
        run: python3 collection/Stronghold-Protocol/asset_cache.py restore upstream source-cache
      - name: Fetch optional assets
        id: fetch_assets
        continue-on-error: true
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          for attempt in 1 2 3; do
            if node tools/fetch-assets.mjs --prune && \
               python3 ../collection/Stronghold-Protocol/asset_cache.py prune-fonts .; then
              if node ../collection/Stronghold-Protocol/verify-assets.mjs; then exit 0; fi
              if [[ "$attempt" -eq 3 ]] && \
                 node ../collection/Stronghold-Protocol/verify-assets.mjs --allow-download-errors; then
                echo '::warning::Some optional art downloads failed; publishing the verified available assets.'
                exit 0
              fi
            fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
      - name: Prepare per-source caches
        id: prepare_source_caches
        if: steps.fetch_assets.outcome == 'success'
        continue-on-error: true
        run: python3 collection/Stronghold-Protocol/asset_cache.py save upstream source-cache
      - name: Cache yuanyan assets
        if: steps.prepare_source_caches.outcome == 'success' && steps.yuanyan_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/yuanyan
          key: ${{ steps.yuanyan_cache.outputs.cache-primary-key }}
      - name: Cache fexli assets
        if: steps.prepare_source_caches.outcome == 'success' && steps.fexli_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/fexli
          key: ${{ steps.fexli_cache.outputs.cache-primary-key }}
      - name: Cache models assets
        if: steps.prepare_source_caches.outcome == 'success' && steps.models_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/models
          key: ${{ steps.models_cache.outputs.cache-primary-key }}
      - name: Cache arkassets assets
        if: steps.prepare_source_caches.outcome == 'success' && steps.arkassets_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/arkassets
          key: ${{ steps.arkassets_cache.outputs.cache-primary-key }}
      - name: Cache fonts assets
        if: steps.prepare_source_caches.outcome == 'success' && steps.fonts_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/fonts
          key: ${{ steps.fonts_cache.outputs.cache-primary-key }}
      - name: Cache gamedata assets
        if: steps.prepare_source_caches.outcome == 'success' && steps.gamedata_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-cache/gamedata
          key: ${{ steps.gamedata_cache.outputs.cache-primary-key }}
      - name: Prepare asset bundle
        shell: bash
        env:
          FETCH_OUTCOME: ${{ steps.fetch_assets.outcome }}
        run: |
          set -euo pipefail
          bundle=/tmp/stronghold-protocol-assets
          mkdir -p "$bundle/public" "$bundle/data"
          if [[ "$FETCH_OUTCOME" == success ]]; then
            mv upstream/public/assets upstream/public/fonts "$bundle/public/"
            cp upstream/data/assets.json "$bundle/data/assets.json"
          else
            echo '::warning::Optional art download failed; building with upstream fallback graphics.'
            mkdir -p "$bundle/public/assets" "$bundle/public/fonts"
            git -C upstream show HEAD:data/assets.json > "$bundle/data/assets.json"
          fi
      - name: Upload asset bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stronghold-protocol-assets
          path: /tmp/stronghold-protocol-assets/
          if-no-files-found: error
          retention-days: 1

  stronghold-protocol:
    needs: asset_bundle
    name: stronghold-protocol
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collection
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: upstream
          persist-credentials: false
          repository: ${{ inputs.source_sha != '' && 'IceCodeNew/Stronghold-Protocol' || 'sganggs/Stronghold-Protocol' }}
          ref: ${{ inputs.source_sha || env.STRONGHOLD_PROTOCOL_VERSION }}
      - name: Download asset bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stronghold-protocol-assets
          path: ./asset-bundle
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Login to DHI
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./collection/Stronghold-Protocol
          build-contexts: |
            src_dir=./upstream
            asset_bundle=./asset-bundle
          target: tested
          build-args: |
            "TEST_RUNTIME_ARGS=[""run"",""--allow-read"",""--allow-net"",""--allow-env"",""--allow-run""]"
            FETCH_ASSETS=${{ needs.asset_bundle.outputs.fetched }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: stronghold-protocol:test
          cache-from: type=gha,scope=stronghold-protocol-${{ inputs.source_sha != '' && 'dev-' || '' }}${{ matrix.platform }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=min,scope=stronghold-protocol-{0}{1}', inputs.source_sha != '' && 'dev-' || '', matrix.platform) || '' }}
      - name: Test image without a public tunnel
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/cloudflared stronghold-protocol:test --version
          mapfile -d '' -t server_command < <(docker image inspect stronghold-protocol:test \
            | jq -j '.[0].Config.Cmd[] + "\u0000"')
          docker run --detach --name stronghold-protocol-smoke \
            --entrypoint /usr/bin/catatonit stronghold-protocol:test \
            -- "${server_command[@]}"
          trap 'docker logs stronghold-protocol-smoke; docker rm -f stronghold-protocol-smoke' EXIT
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' stronghold-protocol-smoke)
            printf 'Health check %s: %s\n' "$attempt" "$status"
            if [[ "$status" == healthy ]]; then
              docker exec stronghold-protocol-smoke /usr/local/bin/deno eval --allow-net \
                'const response = await fetch("http://127.0.0.1:3000/packs/index.json");
                 if (!response.ok) throw new Error(`Language packs: HTTP ${response.status}`);
                 const ids = new Set((await response.json()).packs.map((pack) => pack.id));
                 for (const id of ["en", "ja", "ko", "zh-TW"]) {
                   if (!ids.has(id)) throw new Error(`Missing language pack: ${id}`);
                 }'
              asset_file=$(find asset-bundle/public/assets -type f -print -quit)
              if [[ -n "$asset_file" ]]; then
                asset_path=${asset_file#asset-bundle/public}
                docker exec stronghold-protocol-smoke /usr/local/bin/deno eval --allow-net \
                  'const path = Deno.args[0];
                   const response = await fetch(`http://127.0.0.1:3000${path}`);
                   if (!response.ok) throw new Error(`Asset ${path}: HTTP ${response.status}`);' \
                  "$asset_path"
              else
                echo '::warning::Asset bundle has no optional art to test.'
              fi
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Build and push by digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./collection/Stronghold-Protocol
          build-contexts: |
            src_dir=./upstream
            asset_bundle=./asset-bundle
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=stronghold-protocol-${{ inputs.source_sha != '' && 'dev-' || '' }}${{ matrix.platform }}
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          digest: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/stronghold-protocol-digests/
          touch "/tmp/stronghold-protocol-digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stronghold-protocol-digests-${{ strategy.job-index }}
          path: /tmp/stronghold-protocol-digests/*
          if-no-files-found: error
          retention-days: 1

  stronghold-protocol-multiarch:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    needs: stronghold-protocol
    concurrency:
      group: stronghold-protocol-${{ inputs.source_sha != '' && 'dev-publish' || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/stronghold-protocol-digests/
          pattern: stronghold-protocol-digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create manifest list and push
        id: publish
        working-directory: /tmp/stronghold-protocol-digests/
        env:
          version: ${{ env.STRONGHOLD_PROTOCOL_VERSION }}
          source_sha: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$source_sha" ]]; then
            current_sha=$(git ls-remote https://github.com/IceCodeNew/Stronghold-Protocol.git \
              refs/heads/review-all-in-one | cut -f1)
            if [[ "$current_sha" != "$source_sha" ]]; then
              echo "Skipping stale dev build for $source_sha; review branch is $current_sha."
              exit 0
            fi
            git ls-remote --tags https://github.com/sganggs/Stronghold-Protocol.git \
              > /tmp/stronghold-upstream-tags.txt
            if awk -v sha="$source_sha" '$1 == sha {
              tag = $2
              sub(/^refs\/tags\//, "", tag)
              sub(/\^\{\}$/, "", tag)
              if (tag ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/) found = 1
            } END {exit !found}' /tmp/stronghold-upstream-tags.txt; then
              echo "Skipping dev build for $source_sha; an upstream release tag now matches it."
              exit 0
            fi
          fi
          images=()
          for digest in *; do
            images+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          if [[ -n "$source_sha" ]]; then
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.revision=${source_sha}" \
              --tag "${REGISTRY_IMAGE}:dev" "${images[@]}"
          else
            docker buildx imagetools create --tag "${REGISTRY_IMAGE}:${version}" "${images[@]}"
          fi
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Run Trivy vulnerability scanner
        if: steps.publish.outputs.published == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ inputs.source_sha != '' && 'dev' || env.STRONGHOLD_PROTOCOL_VERSION }}
          format: table
