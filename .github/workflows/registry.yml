name: registry Image CI
permissions: {}

on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/registry.yml"
      - "registry/base.yaml"
      - "registry/Dockerfile"
  schedule:
    - cron: "10 3 1-31/10 * *"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/registry
  # renovate: datasource=docker packageName=library/registry versioning=docker
  REGISTRY_VERSION: 3.1.2

jobs:
  build-registry-base:
    name: Build registry-base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install apko
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
          mise_toml: |
            [tools]
            apko = "latest"

      - name: Install regctl
        uses: regclient/actions/regctl-installer@b7d935a4b4f550aa3b5ad20941f7d2f9285565b2 # main
        with:
          release: v0.11.5

      - name: Build registry-base
        shell: bash
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          apko publish ./registry/base.yaml "${REGISTRY_IMAGE}:base"
          regctl image mod "${REGISTRY_IMAGE}:base" --layer-compress zstd --to-oci --replace

  registry:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      -
        name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:registry"
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,push=true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.REGISTRY_VERSION }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Inspect image
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          REGISTRY_VERSION: ${{ env.REGISTRY_VERSION }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${REGISTRY_VERSION}" \
              | grep -Po '[^ \r\n\t\v]+@sha256:[a-z0-9]+' | xargs -r -t -n 1 docker buildx imagetools inspect --raw
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ env.REGISTRY_VERSION }}
          format: "table"
